      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  description: ''
                  example: []
                  properties:
                    attributes:
                      type: object
                      description: ''
                      example: []
                      properties:
                        startTime:
                          type: string
                          description: 'Start of the appointment. Must be in the future. Must be a valid date. Must be a date after <code>now</code>.'
                          example: '2026-12-10 10:00:00'
                        endTime:
                          type: string
                          description: 'End of the appointment. Must be after the start time. Must be a valid date. Must be a date after <code>data.attributes.startTime</code>.'
                          example: '2026-12-10 11:00:00'
                        status:
                          type: string
                          description: 'pending or confirmed.'
                          example: pending
                          enum:
                            - pending
                            - confirmed
                        bookedVia:
                          type: string
                          description: 'How it was booked: chatbot, portal or walk_in.'
                          example: portal
                          enum:
                            - chatbot
                            - portal
                            - walk_in
                        followUpOf:
                          type: integer
                          description: 'Id of the earlier appointment this one follows up (optional). Must match an existing stored value.'
                          example: null
                          nullable: true
                      required:
                        - startTime
                        - endTime
                    relationships:
                      type: object
                      description: ''
                      example: []
                      properties:
                        patient:
                          type: object
                          description: ''
                          example: []
                          properties:
                            data:
                              type: object
                              description: ''
                              example: []
                              properties:
                                id:
                                  type: integer
