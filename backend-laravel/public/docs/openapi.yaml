openapi: 3.0.3
info:
  title: 'SmileSync API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'https://smilesync.projectsmiledentalclinic.com'
tags:
  -
    name: Appointments
    description: "\nBook, read, reschedule and cancel appointments."
  -
    name: Assistant
    description: "\nThe SmileSync assistant. It understands English, Filipino or both, answers from the clinic's own data,\nand books, reschedules and cancels through the same slot engine as the rest of the API."
  -
    name: Authentication
    description: "\nRegister, login, logout and refresh tokens."
  -
    name: 'Clinic info and hours'
    description: ''
  -
    name: 'Clinic records'
    description: "\nOne controller for the clinic modules (services, schedules, treatments, invoices, inventory, feedback ...).\nEach resource lists who may read and who may write. Every create, update and delete is written to the audit log."
  -
    name: 'Clinic workflow'
    description: "\nDaily queue, check-in, walk-ins, invoices, reports, reminders, patient summary and OCR upload."
  -
    name: Dashboard
    description: ''
  -
    name: 'Landing page'
    description: ''
  -
    name: Lookups
    description: "\nLists the services, dentists and branches used by the booking forms."
  -
    name: 'Patient Appointments'
    description: "\nThe appointments of one patient. The patient id comes from the URL."
  -
    name: 'Patient portal'
    description: ''
  -
    name: Patients
    description: "\nRead patients (list and show)."
  -
    name: 'Scanned forms'
    description: "\nReads a HANDWRITTEN patient form with an AI vision model and returns the patient fields.\nWorks with Google Gemini or Anthropic; set the matching key in .env. Settings are read\nthrough config/ocr.php so they survive config caching in production.\nWithout a key the screen falls back to the basic in-browser reader."
  -
    name: Slots
    description: "\nFind the free time slots of a dentist."
  -
    name: 'Staff inbox'
    description: "\nChats the assistant passed to staff. Staff read the conversation and reply, and the reply\nshows up inside the patient's assistant panel."
  -
    name: Users
    description: "\nManage clinic staff and patient login accounts."
  -
    name: Waitlist
    description: "\nJoin the waiting list when a slot is full. A freed slot is offered to the first person waiting."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Log in with POST /api/v1/auth/login and paste the access_token here.'
security:
  -
    default: []
